<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Для Аяулым ✨</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      height:100vh;
      overflow:hidden;
      display:flex;
      justify-content:center;
      align-items:center;
      font-family:'Segoe UI',sans-serif;

      background:
      radial-gradient(circle at top,#312e81,#0f172a 60%);

      position:relative;
    }

    /* Анимированный фон */

    .background{
      position:absolute;
      width:100%;
      height:100%;
      overflow:hidden;
    }

    .circle{
      position:absolute;
      border-radius:50%;
      background:rgba(255,255,255,0.06);
      animation:float 10s linear infinite;
    }

    .circle:nth-child(1){
      width:180px;
      height:180px;
      left:10%;
      top:80%;
      animation-duration:12s;
    }

    .circle:nth-child(2){
      width:120px;
      height:120px;
      left:70%;
      top:90%;
      animation-duration:9s;
    }

    .circle:nth-child(3){
      width:250px;
      height:250px;
      left:50%;
      top:100%;
      animation-duration:15s;
    }

    @keyframes float{
      from{
        transform:translateY(0) rotate(0deg);
      }
      to{
        transform:translateY(-120vh) rotate(360deg);
      }
    }

    /* Карточка */

    .card{
      position:relative;
      width:90%;
      max-width:370px;

      padding:35px 25px;

      border-radius:32px;

      background:rgba(255,255,255,0.08);

      backdrop-filter:blur(18px);

      border:1px solid rgba(255,255,255,0.15);

      box-shadow:
      0 0 30px rgba(168,85,247,0.25),
      0 15px 40px rgba(0,0,0,0.45);

      text-align:center;

      overflow:hidden;

      animation:cardAppear 1.4s cubic-bezier(.17,.89,.32,1.49);
    }

    @keyframes cardAppear{
      0%{
        opacity:0;
        transform:scale(0.4) rotate(-8deg);
      }

      60%{
        opacity:1;
        transform:scale(1.05) rotate(2deg);
      }

      100%{
        transform:scale(1) rotate(0);
      }
    }

    /* Свет */

    .light{
      position:absolute;
      width:180px;
      height:180px;
      border-radius:50%;
      filter:blur(90px);
      opacity:0.35;
      z-index:-1;
    }

    .light1{
      background:#a855f7;
      top:-50px;
      left:-40px;
    }

    .light2{
      background:#3b82f6;
      bottom:-60px;
      right:-40px;
    }

    /* Эмодзи */

    .emoji{
      font-size:58px;
      margin-bottom:15px;

      opacity:0;

      animation:show 1s ease forwards;
      animation-delay:0.5s;
    }

    h1{
      color:white;
      font-size:34px;
      margin-bottom:18px;
      font-weight:700;

      opacity:0;

      animation:show 1s ease forwards;
      animation-delay:1s;
    }

    p{
      color:#f3f4f6;
      font-size:20px;
      line-height:1.8;

      opacity:0;

      animation:show 1s ease forwards;
      animation-delay:1.6s;
    }

    .footer{
      margin-top:24px;
      color:#cbd5e1;
      font-size:14px;

      opacity:0;

      animation:show 1s ease forwards;
      animation-delay:2.3s;
    }

    @keyframes show{
      from{
        opacity:0;
        transform:translateY(25px);
      }

      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    .highlight{
      color:#facc15;
      font-weight:bold;
      text-shadow:0 0 10px rgba(250,204,21,0.5);
    }

    /* Блестящая линия */

    .shine{
      position:absolute;
      top:-100%;
      left:-50%;
      width:60%;
      height:250%;
      background:rgba(255,255,255,0.08);
      transform:rotate(25deg);

      animation:shine 5s infinite;
    }

    @keyframes shine{
      0%{
        left:-80%;
      }

      100%{
        left:140%;
      }
    }

  </style>
</head>

<body>

  <div class="background">
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>
  </div>

  <div class="card">

    <div class="shine"></div>

    <div class="light light1"></div>
    <div class="light light2"></div>

    <div class="emoji">✨</div>

    <h1>Аяулым</h1>

    <p>
      Завтра <span class="highlight">хорошо сдашь практику</span> 
      <br><br>
      Если что —
      <span class="highlight">
        шымкентский вариант
      </span>
      подключим 😎
    </p>

    <div class="footer">
      Всё будет хорошо ✨
    </div>

  </div>

</body>
</html>
